name: Benchmarks

# Living benchmarks: regenerate the runtime table in
# docs/internals/benchmarks.md from a fresh run so the published numbers
# always reflect the current code. Monthly + on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/franciscothiesen/mirror_bridge-benchmark:latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Besides the table, the suite builds the benchmark module a second
      # time from the commit named in benchmarks/gate_baseline.json and times
      # it alongside HEAD. The checkout above is one commit deep, so the suite
      # fetches that commit by SHA; it needs the credentials actions/checkout
      # leaves in the repository's config, and the safe.directory entry above.
      - name: Run benchmark suite
        run: ./benchmarks/run_all_benchmarks.sh

      # mirror_bridge is gated against itself: HEAD and the baseline commit,
      # measured in the same job on the same machine. A ratio against a
      # competitor cannot do this job, because it also moves when the runner's
      # CPU changes and when the competitor ships a release. While such a
      # ratio was the gate it failed every run, and never because
      # mirror_bridge had changed. Where a competitor is faster the output
      # says so without failing: that is a fact to see, not a regression.
      #
      # --require-baseline makes "the baseline could not be fetched, built or
      # measured" a failure rather than a gate that passed by comparing
      # nothing.
      #
      # This step records its result rather than acting on it, so that the
      # refresh below is published whatever the verdict. The failing is done
      # by a later step.
      - name: Gate mirror_bridge against its baseline commit
        id: gate
        run: |
          set +e
          python3 benchmarks/check_ratios.py \
            benchmarks/runtime/python/runtime_results.json \
            --require-baseline
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Splice regenerated runtime table into the benchmarks page
        run: |
          python3 benchmarks/format_results.py \
            benchmarks/runtime/python/runtime_results.json \
            --commit "$GITHUB_SHA" \
            --env "GitHub Actions ubuntu-latest ($(nproc) cores, containerized)" \
            --fragment > /tmp/runtime_fragment.md
          awk '
            /<!-- RUNTIME:BEGIN/ { print; system("cat /tmp/runtime_fragment.md"); skip=1; next }
            /<!-- RUNTIME:END/   { skip=0 }
            !skip
          ' docs/internals/benchmarks.md > /tmp/benchmarks.md
          mv /tmp/benchmarks.md docs/internals/benchmarks.md

      # format_trading_results.py refuses to render when numpy was absent,
      # because the page would then claim a vectorised comparison it never
      # made. That refusal is right, but it used to be fatal here, and this
      # step runs before the PR: one missing competitor threw away a runtime
      # table that had already regenerated cleanly. The whole monthly refresh
      # died that way, which is why the published page kept seven of the
      # twelve measured operations for weeks.
      #
      # So record the refusal and leave the committed trading fragment where
      # it is. It carries its own provenance line, so a page with a fresh
      # runtime table and last month's trading table still says which is
      # which. A later step does the failing, after the PR exists.
      - name: Splice regenerated trading table into the benchmarks page
        id: trading
        run: |
          set +e
          python3 benchmarks/format_trading_results.py \
            --commit "$GITHUB_SHA" \
            --env "GitHub Actions ubuntu-latest ($(nproc) cores, containerized)" \
            --fragment > /tmp/trading_fragment.md
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "the trading table did not render; keeping the committed one"
            exit 0
          fi
          set -e
          awk '
            /<!-- TRADING:BEGIN/ { print; system("cat /tmp/trading_fragment.md"); skip=1; next }
            /<!-- TRADING:END/   { skip=0 }
            !skip
          ' docs/internals/benchmarks.md > /tmp/benchmarks.md
          mv /tmp/benchmarks.md docs/internals/benchmarks.md

      # main is protected (PR-only), so the refresh lands as a PR for the
      # maintainer to merge. The action is a no-op when the page is unchanged.
      - name: Open PR with the regenerated page
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            docs/internals/benchmarks.md
          commit-message: "Regenerate runtime benchmarks page"
          title: "Regenerate runtime benchmarks page"
          body: |
            Automated benchmark refresh: the runtime suite was rerun on a
            GitHub Actions runner and the table in
            `docs/internals/benchmarks.md` regenerated from the results.
            Absolute times shift with runner hardware. The ratio columns
            shift with it too, less, and whenever a competitor pin in
            `Dockerfile.benchmark` is bumped: they are what was measured
            this month, not a regression signal.

            Whether mirror_bridge itself got slower is a separate check in
            the run that produced this PR, which times HEAD against the
            commit in `benchmarks/gate_baseline.json` on the same machine.
            This PR is opened whether or not that check passed, so look at
            the run before merging.
          branch: bot/benchmarks-refresh
          delete-branch: true

      # The checks that can fail run last, after the PR exists. None of them
      # may stop the refresh from being published: a month's numbers are worth
      # more than the promptness of a red build, and a table that shows a
      # regression is more use than no table.
      - name: Fail if a measured operation never reached the page
        run: |
          python3 benchmarks/format_results.py \
            benchmarks/runtime/python/runtime_results.json \
            --fragment --strict > /dev/null

      - name: Fail if the trading table could not be regenerated
        run: |
          if [ "${{ steps.trading.outputs.rc }}" != "0" ]; then
            echo "See the 'Splice regenerated trading table' step above for why."
            echo "The page kept its committed trading numbers; the runtime table is fresh."
            exit 1
          fi

      - name: Fail if mirror_bridge regressed against its baseline, or was not compared
        run: |
          if [ "${{ steps.gate.outputs.rc }}" != "0" ]; then
            echo "See the 'Gate mirror_bridge against its baseline commit' step above for which."
            exit 1
          fi
